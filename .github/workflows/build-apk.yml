        run: |
          mkdir -p android-project
          printf '%s' "$PROJECT_ZIP_B64" | base64 --decode > /tmp/myai-project.zip
          unzip -q /tmp/myai-project.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gemini Secret
        working-directory: android-project
        shell: bash
        run: |
          printf '\nGEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> gradle.properties

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-APK
          path: "android-project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
