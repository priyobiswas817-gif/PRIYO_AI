name: Build MyAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      # 1. GitHub repository-এর code নেওয়া
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17 সেটআপ
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. GitHub Secret আছে কিনা পরীক্ষা
      - name: Check Gemini Secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing."
            exit 1
          fi
          echo "Gemini Secret is configured."

      # 4. Secret temporary local.properties-এ দেওয়া
      - name: Configure Gemini Secret
        shell: bash
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > local.properties

      # 5. Gradle wrapper executable করা
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 6. APK Build
      - name: Build APK
        run: ./gradlew assembleDebug

      # 7. APK GitHub Artifact হিসেবে রাখা
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
