name: Build MyAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gemini Secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing."
            exit 1
          fi
          echo "Gemini Secret is configured."

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts was found."
            echo "The Android/Gradle project is not present in the repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gemini Secret for Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          printf '\nGEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> gradle.properties

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
